<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Animated realistic water flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080d14"/>
      <stop offset="55%" stop-color="#07131f"/>
      <stop offset="100%" stop-color="#02070d"/>
    </linearGradient>
    <linearGradient id="waterBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#062d55"/>
      <stop offset="22%" stop-color="#009eea"/>
      <stop offset="46%" stop-color="#025f9b"/>
      <stop offset="68%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#05274a"/>
      <animate attributeName="x1" values="-0.25;0.15;-0.25" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.75;1.15;0.75" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="waterFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#031d34"/>
      <stop offset="18%" stop-color="#0589c9"/>
      <stop offset="38%" stop-color="#003d68"/>
      <stop offset="62%" stop-color="#00b8f2"/>
      <stop offset="82%" stop-color="#045a8c"/>
      <stop offset="100%" stop-color="#02121f"/>
      <animate attributeName="x1" values="0;-0.4;0" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.6;1" dur="6.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4be8ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#e2fbff" stop-opacity=".92"/>
      <stop offset="55%" stop-color="#48ddff" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#4be8ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1.2" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2.2" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#58efff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#009be8" stop-opacity="0"/>
    </radialGradient>
    <filter id="waterDistort" x="-10%" y="-30%" width="120%" height="170%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .035" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" values=".008 .035;.014 .055;.010 .040;.008 .035" dur="7s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="waterClip"><rect x="0" y="64" width="1200" height="156"/></clipPath>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>
  <text x="600" y="38" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="2" fill="#00e5ff">BUILD • CREATE • INNOVATE</text>

  <g clip-path="url(#waterClip)">
    <ellipse cx="220" cy="170" rx="190" ry="88" fill="url(#glow)" opacity=".22" filter="url(#blur)">
      <animate attributeName="cx" values="-80;1280;-80" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="900" cy="166" rx="160" ry="70" fill="url(#glow)" opacity=".15" filter="url(#blur)">
      <animate attributeName="cx" values="1260;-120;1260" dur="15s" repeatCount="indefinite"/>
    </ellipse>

    <g filter="url(#waterDistort)">
      <path fill="url(#waterBack)" opacity=".78"
        d="M-120 118 C 20 86, 130 149, 270 119 S 510 95, 650 122 S 900 154, 1035 118 S 1230 92, 1320 126 L1320 230 L-120 230 Z">
        <animate attributeName="d" dur="6s" repeatCount="indefinite"
          values="
          M-120 118 C 20 86, 130 149, 270 119 S 510 95, 650 122 S 900 154, 1035 118 S 1230 92, 1320 126 L1320 230 L-120 230 Z;
          M-120 128 C 25 154, 145 94, 285 124 S 500 150, 655 116 S 905 91, 1040 126 S 1225 151, 1320 112 L1320 230 L-120 230 Z;
          M-120 118 C 20 86, 130 149, 270 119 S 510 95, 650 122 S 900 154, 1035 118 S 1230 92, 1320 126 L1320 230 L-120 230 Z"/>
      </path>

      <path fill="url(#waterFront)" opacity=".94"
        d="M-120 148 C 35 105, 155 171, 300 140 S 535 119, 684 151 S 930 181, 1080 143 S 1240 116, 1320 151 L1320 230 L-120 230 Z">
        <animate attributeName="d" dur="4.8s" repeatCount="indefinite"
          values="
          M-120 148 C 35 105, 155 171, 300 140 S 535 119, 684 151 S 930 181, 1080 143 S 1240 116, 1320 151 L1320 230 L-120 230 Z;
          M-120 137 C 30 177, 165 116, 305 151 S 545 176, 690 139 S 925 109, 1070 154 S 1245 179, 1320 139 L1320 230 L-120 230 Z;
          M-120 148 C 35 105, 155 171, 300 140 S 535 119, 684 151 S 930 181, 1080 143 S 1240 116, 1320 151 L1320 230 L-120 230 Z"/>
      </path>

      <path d="M-120 138 C 40 98, 150 157, 300 132 S 550 113, 700 141 S 940 166, 1090 134 S 1240 112, 1320 143"
        fill="none" stroke="url(#shine)" stroke-width="5" stroke-linecap="round" opacity=".9" filter="url(#softGlow)">
        <animate attributeName="d" dur="5.2s" repeatCount="indefinite"
          values="
          M-120 138 C 40 98, 150 157, 300 132 S 550 113, 700 141 S 940 166, 1090 134 S 1240 112, 1320 143;
          M-120 148 C 38 167, 158 106, 305 142 S 548 167, 696 131 S 945 104, 1085 145 S 1246 169, 1320 132;
          M-120 138 C 40 98, 150 157, 300 132 S 550 113, 700 141 S 940 166, 1090 134 S 1240 112, 1320 143"/>
      </path>

      <path d="M-100 177 C 90 149, 205 198, 392 170 S 680 153, 835 181 S 1120 197, 1300 166"
        fill="none" stroke="#54dfff" stroke-width="2.2" opacity=".42">
        <animate attributeName="d" dur="3.8s" repeatCount="indefinite"
          values="
          M-100 177 C 90 149, 205 198, 392 170 S 680 153, 835 181 S 1120 197, 1300 166;
          M-100 165 C 88 201, 210 153, 398 180 S 675 197, 842 169 S 1116 150, 1300 179;
          M-100 177 C 90 149, 205 198, 392 170 S 680 153, 835 181 S 1120 197, 1300 166"/>
      </path>
    </g>

    <g fill="#9cf3ff" opacity=".75">
      <circle cx="90" cy="163" r="3"><animate attributeName="cy" values="205;120;205" dur="4.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="276" cy="181" r="2"><animate attributeName="cy" values="214;130;214" dur="3.7s" begin=".8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="3.7s" begin=".8s" repeatCount="indefinite"/></circle>
      <circle cx="528" cy="176" r="3.2"><animate attributeName="cy" values="218;118;218" dur="5.1s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="5.1s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="742" cy="190" r="2.4"><animate attributeName="cy" values="217;135;217" dur="4.2s" begin=".2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="4.2s" begin=".2s" repeatCount="indefinite"/></circle>
      <circle cx="958" cy="174" r="2.8"><animate attributeName="cy" values="212;115;212" dur="4.8s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.75;0" dur="4.8s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="186" r="2"><animate attributeName="cy" values="216;128;216" dur="3.9s" begin="1.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="3.9s" begin="1.7s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>