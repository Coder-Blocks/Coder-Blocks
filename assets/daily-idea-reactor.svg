<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050814"/><stop offset=".5" stop-color="#081b2d"/><stop offset="1" stop-color="#130a2a"/></linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="26" fill="url(#b)"/>
<rect x="2" y="2" width="1196" height="356" rx="24" fill="none" stroke="#00e5ff" stroke-opacity=".35"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="60" y="55" fill="#00e5ff" font-size="15" letter-spacing="4">TIC // DAILY IDEA REACTOR</text>
<text x="60" y="105" fill="#ffffff" font-size="30" font-weight="700">FIELD-SYNC LOCAL MARKET COPILOT</text>
<text x="60" y="142" fill="#95a9b6" font-size="15">Generated from a date-seeded product genome • 2026-09-24</text>
<text x="60" y="202" fill="#6ee7b7" font-size="15" letter-spacing="2">DOMAIN</text>
<text x="60" y="232" fill="#ffffff" font-size="20">RURAL COMMERCE</text>
<text x="355" y="202" fill="#a78bfa" font-size="15" letter-spacing="2">MECHANISM</text>
<text x="355" y="232" fill="#ffffff" font-size="20">OFFLINE-FIRST COPILOT</text>
<text x="705" y="202" fill="#fbbf24" font-size="15" letter-spacing="2">CONSTRAINT</text>
<text x="705" y="232" fill="#ffffff" font-size="20">WORKS WITH ZERO LOGIN</text>
<text x="60" y="294" fill="#7dd3fc" font-size="15">Challenge:</text>
<text x="155" y="294" fill="#dbeafe" font-size="15">Help local sellers capture orders, stock and follow-ups even with unreliable internet.</text>
<circle cx="1095" cy="90" r="42" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="8 6" filter="url(#g)">
<animateTransform attributeName="transform" type="rotate" from="0 1095 90" to="360 1095 90" dur="7s" repeatCount="indefinite"/>
</circle>
<circle cx="1095" cy="90" r="15" fill="#00e5ff" opacity=".75" filter="url(#g)"><animate attributeName="r" values="12;18;12" dur="2.3s" repeatCount="indefinite"/></circle>
<text x="1095" y="160" text-anchor="middle" fill="#95a9b6" font-size="12" letter-spacing="2">REACTOR ONLINE</text>
</g>
</svg>