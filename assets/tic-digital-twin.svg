<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040814"/>
      <stop offset="0.55" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#1a0b2d"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#6cf0ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#5eead4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="517" rx="26.5" fill="none" stroke="#00e5ff" stroke-opacity="0.28"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="54" y="52" fill="#00e5ff" font-size="15" letter-spacing="4">TIC // DIGITAL TWIN INTERFACE</text>
    <text x="54" y="102" fill="#ffffff" font-size="34" font-weight="700">RAVI TWIN — INTERACTIVE IDENTITY MAP</text>
    <text x="54" y="132" fill="#9ccad6" font-size="15">A portal-based command system for people who want to build, learn, hire or present a challenge.</text>
  </g>

  <g transform="translate(268 290)">
    <ellipse cx="0" cy="120" rx="122" ry="28" fill="#0ff" opacity="0.12"/>
    <circle cx="0" cy="-50" r="62" fill="none" stroke="url(#cy)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="-50" r="44" fill="#091827" stroke="#9beafe" stroke-opacity="0.35"/>
    <circle cx="-15" cy="-58" r="8" fill="#d9fbff"/>
    <circle cx="15" cy="-58" r="8" fill="#d9fbff"/>
    <circle cx="-15" cy="-58" r="3" fill="#0c1526"/>
    <circle cx="15" cy="-58" r="3" fill="#0c1526"/>
    <path d="M-16 -34 Q0 -22 16 -34" fill="none" stroke="#9beafe" stroke-width="3" stroke-linecap="round"/>
    <path d="M-52 -48 Q0 -106 52 -48" fill="#101a30" stroke="#46d7f4" stroke-opacity="0.35"/>
    <rect x="-52" y="18" width="104" height="118" rx="26" fill="#0c1730" stroke="#4be2ff" stroke-opacity="0.4"/>
    <rect x="-82" y="42" width="30" height="90" rx="15" fill="#0c1730" stroke="#4be2ff" stroke-opacity="0.35"/>
    <rect x="52" y="42" width="30" height="90" rx="15" fill="#0c1730" stroke="#4be2ff" stroke-opacity="0.35"/>
    <rect x="-42" y="136" width="28" height="92" rx="14" fill="#0c1730" stroke="#4be2ff" stroke-opacity="0.35"/>
    <rect x="14" y="136" width="28" height="92" rx="14" fill="#0c1730" stroke="#4be2ff" stroke-opacity="0.35"/>
    <circle cx="0" cy="88" r="15" fill="#00e5ff" opacity="0.9" filter="url(#glow)">
      <animate attributeName="r" values="12;18;12" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle cx="0" cy="88" r="56" fill="none" stroke="#00e5ff" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="6 7">
        <animateTransform attributeName="transform" type="rotate" from="0 0 88" to="360 0 88" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="88" r="72" fill="none" stroke="#8b5cf6" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="14 10">
        <animateTransform attributeName="transform" type="rotate" from="360 0 88" to="0 0 88" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="0" y="264" text-anchor="middle" fill="#c6faff" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="3">DIGITAL TWIN ONLINE</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(520 180)">
      <rect width="290" height="72" rx="18" fill="#081426" stroke="#00e5ff" stroke-opacity="0.35"/>
      <text x="28" y="29" fill="#00e5ff" font-size="13" letter-spacing="3">01 // BUILD</text>
      <text x="28" y="53" fill="#fff" font-size="20" font-weight="700">Products, portfolio & execution</text>
    </g>
    <g transform="translate(840 180)">
      <rect width="290" height="72" rx="18" fill="#101026" stroke="#8b5cf6" stroke-opacity="0.45"/>
      <text x="28" y="29" fill="#c084fc" font-size="13" letter-spacing="3">02 // LEARN</text>
      <text x="28" y="53" fill="#fff" font-size="20" font-weight="700">Courses, skills & growth path</text>
    </g>
    <g transform="translate(520 282)">
      <rect width="290" height="72" rx="18" fill="#081426" stroke="#00e5ff" stroke-opacity="0.35"/>
      <text x="28" y="29" fill="#00e5ff" font-size="13" letter-spacing="3">03 // HIRE</text>
      <text x="28" y="53" fill="#fff" font-size="20" font-weight="700">Services, collaboration & contact</text>
    </g>
    <g transform="translate(840 282)">
      <rect width="290" height="72" rx="18" fill="#101026" stroke="#8b5cf6" stroke-opacity="0.45"/>
      <text x="28" y="29" fill="#c084fc" font-size="13" letter-spacing="3">04 // CHALLENGE</text>
      <text x="28" y="53" fill="#fff" font-size="20" font-weight="700">Send a real-world problem</text>
    </g>
  </g>

  <g font-family="Consolas, monospace" font-size="13" fill="#8db9c8">
    <text x="54" y="466">> twin_mode = ACTIVE</text>
    <text x="54" y="490">> intent_router = BUILD | LEARN | HIRE | CHALLENGE</text>
    <text x="620" y="466">> idea_engine = TIC</text>
    <text x="620" y="490">> status = READY_FOR_INTERACTION</text>
  </g>
</svg>