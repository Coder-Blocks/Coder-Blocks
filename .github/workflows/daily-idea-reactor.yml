name: TIC Daily Idea Reactor

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate daily product genome
        shell: python
        run: |
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib, html, random

          day = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          seed = int(hashlib.sha256(("TIC:"+day).encode()).hexdigest()[:16], 16)
          r = random.Random(seed)

          domains = [
            ("RURAL COMMERCE","local sellers capture orders, stock and follow-ups"),
            ("HEALTH WORKFLOWS","small clinics reduce repetitive coordination work"),
            ("EDUCATION","teachers turn lessons into active student practice"),
            ("HOME DESIGN","families explore space decisions before construction"),
            ("LOCAL SERVICES","small service teams manage customers and repeat work"),
            ("CREATOR TOOLS","creators repurpose one idea into multiple useful formats"),
            ("SAFETY OPERATIONS","teams capture field observations before they are forgotten"),
            ("ACCESSIBILITY","people complete digital tasks with less typing and complexity")
          ]
          mechanisms = [
            "OFFLINE-FIRST COPILOT","VISUAL DECISION MAP","VOICE-TO-WORKFLOW ENGINE",
            "LOCAL AI ASSISTANT","ZERO-FORM INTERFACE","MICRO-AUTOMATION LAYER",
            "CAMERA-TO-ACTION WORKFLOW","ADAPTIVE CHECKLIST SYSTEM"
          ]
          constraints = [
            "WORKS WITH ZERO LOGIN","RUNS ON LOW-END DEVICES","NO PAID API REQUIRED",
            "ONE-HAND OPERATION","LOCAL DATA BY DEFAULT","USABLE IN UNDER 60 SECONDS",
            "MULTILINGUAL FIRST","WORKS DURING POOR INTERNET"
          ]
          prefixes = ["FIELD-SYNC","NANO","LOCAL","PULSE","SPARK","MOTION","LENS","BRIDGE"]
          suffixes = ["COPILOT","ENGINE","GRID","FLOW","OS","LAYER","LOOP","STUDIO"]

          domain, need = r.choice(domains)
          mechanism = r.choice(mechanisms)
          constraint = r.choice(constraints)
          title = f"{r.choice(prefixes)} {domain.split()[0]} {r.choice(suffixes)}"
          challenge = f"Help {need} — while the product {constraint.lower()}."

          def esc(s): return html.escape(s)
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
          <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050814"/><stop offset=".5" stop-color="#081b2d"/><stop offset="1" stop-color="#130a2a"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <rect width="1200" height="360" rx="26" fill="url(#b)"/><rect x="2" y="2" width="1196" height="356" rx="24" fill="none" stroke="#00e5ff" stroke-opacity=".35"/>
          <g font-family="Segoe UI,Arial,sans-serif">
          <text x="60" y="55" fill="#00e5ff" font-size="15" letter-spacing="4">TIC // DAILY IDEA REACTOR</text>
          <text x="60" y="105" fill="#fff" font-size="30" font-weight="700">{esc(title)}</text>
          <text x="60" y="142" fill="#95a9b6" font-size="15">Generated from a date-seeded product genome • {day}</text>
          <text x="60" y="202" fill="#6ee7b7" font-size="15" letter-spacing="2">DOMAIN</text><text x="60" y="232" fill="#fff" font-size="20">{esc(domain)}</text>
          <text x="355" y="202" fill="#a78bfa" font-size="15" letter-spacing="2">MECHANISM</text><text x="355" y="232" fill="#fff" font-size="20">{esc(mechanism)}</text>
          <text x="705" y="202" fill="#fbbf24" font-size="15" letter-spacing="2">CONSTRAINT</text><text x="705" y="232" fill="#fff" font-size="20">{esc(constraint)}</text>
          <text x="60" y="294" fill="#7dd3fc" font-size="15">Challenge:</text><text x="155" y="294" fill="#dbeafe" font-size="15">{esc(challenge[:118])}</text>
          <circle cx="1095" cy="90" r="42" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="8 6" filter="url(#g)"><animateTransform attributeName="transform" type="rotate" from="0 1095 90" to="360 1095 90" dur="7s" repeatCount="indefinite"/></circle>
          <circle cx="1095" cy="90" r="15" fill="#00e5ff" opacity=".75" filter="url(#g)"><animate attributeName="r" values="12;18;12" dur="2.3s" repeatCount="indefinite"/></circle>
          <text x="1095" y="160" text-anchor="middle" fill="#95a9b6" font-size="12" letter-spacing="2">REACTOR ONLINE</text>
          </g></svg>'''
          Path("assets").mkdir(exist_ok=True)
          Path("assets/daily-idea-reactor.svg").write_text(svg, encoding="utf-8")
          Path("DAILY_IDEA.md").write_text(
            f"# TIC Daily Idea Reactor\n\n**Date:** {day}\n\n**Concept:** {title}\n\n"
            f"- Domain: {domain}\n- Mechanism: {mechanism}\n- Constraint: {constraint}\n\n"
            f"**Challenge:** {challenge}\n", encoding="utf-8"
          )
      - name: Commit reactor output
        run: |
          git config user.name "TIC Idea Reactor"
          git config user.email "actions@users.noreply.github.com"
          git add assets/daily-idea-reactor.svg DAILY_IDEA.md
          git diff --cached --quiet || git commit -m "reactor: generate daily innovation seed"
          git push
